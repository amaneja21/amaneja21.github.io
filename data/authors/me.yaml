bio: |
  Amit Aneja leads product management for zero trust networking at Zscaler.
  His work focuses on network security, microsegmentation, OT and ICS security,
  and zero trust for AI agent communication. He previously held product roles
  at Microsoft (Azure), VMware (NSX) and VeloCloud, after more than ten years
  at Cisco and a Cisco partner. He holds a CCIE (Emeritus) in Routing and
  Switching and Service Provider.

