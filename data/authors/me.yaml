bio: |
  Amit Aneja is Senior Director of Product Management at Zscaler, where he leads
  the Zero Trust Branch portfolio. A trusted technology executive with over two
  decades of experience in cloud infrastructure, hybrid cloud, and networking,
  Amit has a proven record of building and scaling large-scale platforms and
  $100M+ ARR products. At Microsoft, he led product strategy, OKRs, and
  multi-year roadmaps for Azure VMware Solution and Nutanix Cloud Clusters on
  Azure. His earlier career includes senior product roles at VMware (NSX,
  VeloCloud) and Cisco, giving him deep expertise across the enterprise
  networking and security stack.

